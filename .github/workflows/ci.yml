name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.x
          cache: true

      - name: Ambil dependensi
        run: |
          flutter pub get
          (cd example && flutter pub get)

      - name: Analisis
        run: flutter analyze

      - name: Test package
        run: flutter test

      - name: Test galeri (example)
        working-directory: example
        run: flutter test

      - name: Cek siap terbit (pub.dev)
        run: flutter pub publish --dry-run