name: idds_flutter
description: >-
  Unofficial Flutter port of INA Digital Design System (IDDS):
  design tokens, multi-brand theming, and UI components.
version: 0.2.1
repository: https://github.com/julvikramsupandi/idds_flutter
issue_tracker: https://github.com/julvikramsupandi/idds_flutter/issues
documentation: https://julvikramsupandi.github.io/idds_flutter/

topics:
  - design-system
  - ui
  - widget
  - theme
  - indonesia

screenshots:
  - description: Contoh aplikasi mobile layanan publik, layar Masuk (Text Field, Password, Checkbox, Button).
    path: doc/screenshots/mobile-masuk.webp
  - description: Contoh aplikasi mobile, layar Beranda Layanan (Search, Card, Progress Bar, List).
    path: doc/screenshots/mobile-beranda.webp
  - description: Contoh aplikasi mobile, layar Form Pengajuan (Stepper, Text Field, Date Picker, Select).
    path: doc/screenshots/mobile-form-pengajuan.webp
  - description: Contoh dasbor web dengan brand INAgov dalam mode terang.
    path: doc/screenshots/beranda.webp
  - description: Contoh dasbor web dengan brand BKN dalam mode gelap.
    path: doc/screenshots/beranda-gelap-bkn.webp
  - description: Text Input, Checkbox, Radio, dan Toggle beserta status validasi.
    path: doc/screenshots/form.webp
  - description: Grafik garis, batang, dan donat dengan palet IDDS.
    path: doc/screenshots/grafik.webp

environment:
  sdk: ^3.6.0
  flutter: ">=3.27.0"

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
