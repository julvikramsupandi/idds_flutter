name: idds_flutter
description: >-
  Unofficial Flutter port of INA Digital Design System (IDDS):
  design tokens, multi-brand theming, and UI components.
version: 0.2.2
repository: https://github.com/julvikramsupandi/idds_flutter
issue_tracker: https://github.com/julvikramsupandi/idds_flutter/issues
documentation: https://julvikramsupandi.github.io/idds_flutter/

topics:
  - design-system
  - ui
  - widget
  - theme
  - indonesia

screenshots:
  - description: Aplikasi mobile layanan publik, layar Masuk, brand INAgov mode terang.
    path: doc/screenshots/mobile-masuk.webp
  - description: Layar Beranda Layanan, brand PANRB mode terang.
    path: doc/screenshots/mobile-beranda.webp
  - description: Layar Form Pengajuan dengan Stepper, brand LAN mode terang.
    path: doc/screenshots/mobile-form-pengajuan.webp
  - description: Layar Masuk, brand PANRB mode gelap.
    path: doc/screenshots/mobile-masuk-gelap.webp
  - description: Bottom sheet detail layanan, brand BKN mode gelap.
    path: doc/screenshots/mobile-beranda-gelap.webp
  - description: Validasi form dan toast, brand INAgov mode gelap.
    path: doc/screenshots/mobile-form-pengajuan-gelap.webp
  - description: Contoh dasbor web dengan brand INAgov dalam mode terang.
    path: doc/screenshots/beranda.webp
  - description: Contoh dasbor web dengan brand BKN dalam mode gelap.
    path: doc/screenshots/beranda-gelap-bkn.webp

environment:
  sdk: ^3.6.0
  flutter: ">=3.27.0"

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
